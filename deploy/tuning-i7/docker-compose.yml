# KiCraft auto-tuning worker (homelab i7 / unraid). Build once; it clones the
# repo + corpus into the mounted volume, tunes, and writes runs to /data/runs.
# Watch with:  docker logs -f kicraft-tune
services:
  kicraft-tune:
    build: .
    image: kicraft-tune:latest
    container_name: kicraft-tune
    # IMPORTANT: put /data on a fast pool (SSD/NVMe cache), NOT the spinning
    # array — each eval copies a workspace to scratch, so it is I/O heavy.
    volumes:
      - /mnt/user/appdata/kicraft-tune:/data
    environment:
      GENS: "40"
      SEEDS: "0,1"        # K seeds/board; placement is deterministic, this averages routing noise
      POPSIZE: "8"
      SCAL: "all_four"    # correctness | balanced | speed | all_four (fab+drc+time+area+order)
      TIMEOUT: "600"      # per-eval cap (s)
      RUN_ID: "i11"       # fresh run id (i7/i8/i9/i10 are prior runs; don't reuse)
      # TOPK: "12"                 # active params after screening (default 12)
      # KICRAFT_BUILD_SLOTS: "18"  # concurrent evals; default = cores*3/4 (eval pool = slots-1). Lower if RAM-bound.
      # KICRAFT_BRANCH: "main"
      # PIN: "routing_max_passes,psw_bbox_packing,..."   # always-active knobs (entrypoint has a sensible default)
      # ACTIVE: "edge_margin_mm,placement_clearance_mm,..."  # tune EXACTLY these, skip screening (overrides PIN)
    restart: "no"

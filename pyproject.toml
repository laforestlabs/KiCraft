[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kicraft"
version = "0.1.0"
description = "KiCad PCB automation toolkit — placement, routing, scoring, and experiment management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scoring = [
    "Pillow>=10.0",
]
experiment = [
    "matplotlib>=3.7",
]
design = [
    "pydantic>=2.6",
    "kicad-skip>=0.2",
    "easyeda2kicad>=1.0",
    # Robust 2D geometry for non-rectangular board outlines: boolean union of
    # shape-program primitives (e.g. a snowman = union of circles), polygon
    # offset, and point/rect-in-polygon containment. See kicraft/shapes/.
    "shapely>=2.0",
]
tuning = [
    "cma>=4.0",
]
server = [
    "requests>=2.31",
    "nicegui>=1.4",
    "stripe>=7",
]
# Load / stress testing harness. psutil is the fast path for host/process metrics
# (metrics.py falls back to /proc when it is absent, so this extra is optional).
loadtest = [
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
# Core pipeline
solve-subcircuits = "kicraft.cli.solve_subcircuits:main"
compose-subcircuits = "kicraft.cli.compose_subcircuits:main"
solve-hierarchy = "kicraft.cli.solve_hierarchy:main"

# Experiment management
autoexperiment = "kicraft.cli.autoexperiment:main"
clean-experiments = "kicraft.cli.clean_experiments:main"
watch-status = "kicraft.cli.watch_status:main"

# Scoring & rendering
score-layout = "kicraft.cli.score_layout:main"
render-pcb = "kicraft.cli.render_pcb:main"
render-drc-overlay = "kicraft.cli.render_drc_overlay:main"
render-failure-heatmap = "kicraft.cli.render_failure_heatmap:main"

# Analysis
diff-rounds = "kicraft.cli.diff_rounds:main"
generate-report = "kicraft.cli.generate_report:main"
plot-results = "kicraft.cli.plot_results:main"
token-report = "kicraft.cli.token_report:main"
web-cost-report = "kicraft.cli.web_cost_report:main"
part-query-report = "kicraft.cli.part_query_report:main"
provider-bench = "kicraft.cli.provider_bench:main"

# Server (capped agent-loop backend)
kicraft-smoketest = "kicraft.server.smoketest:main"
kicraft-web = "kicraft.server.web:main"
kicraft-accounts = "kicraft.server.accounts_cli:main"

# Load / stress testing harness (build-storm / pipeline / web scenarios -> /admin/loadtest)
kicraft-loadtest = "kicraft.loadtest.__main__:main"

# Evaluation (admin web self-eval; shares the kicraft.eval core with the offline harness)
kicraft-eval-web = "kicraft.eval.run_web:main"
# Batch self-eval: drive every curated example brief end to end and grade it (/self-eval)
kicraft-eval-batch = "kicraft.eval.self_eval:main"

# Board manipulation
move-component = "kicraft.cli.move_component:main"
align-components = "kicraft.cli.align_components:main"
arrange-grid = "kicraft.cli.arrange_grid:main"
add-gnd-zone = "kicraft.cli.add_gnd_zone:main"
add-group-labels = "kicraft.cli.add_group_labels:main"
cleanup-routing = "kicraft.cli.cleanup_routing:main"
split-schematic = "kicraft.cli.split_schematic:main"

# KiCraft design CLI: deterministic helpers; LLM stages run in the Claude Code skill
kicraft = "kicraft.design.cli_app:main"

# Leaf library (read-only — promotion is GUI-driven)
kicraft-leaf = "kicraft.cli.leaf:main"

# Inspection
list-footprints = "kicraft.cli.list_footprints:main"
check-trace-widths = "kicraft.cli.check_trace_widths:main"
run-drc = "kicraft.cli.run_drc:main"
net-report = "kicraft.cli.net_report:main"
inspect-subcircuits = "kicraft.cli.inspect_subcircuits:main"
inspect-solved-subcircuits = "kicraft.cli.inspect_solved_subcircuits:main"

[tool.setuptools.packages.find]
include = ["kicraft*"]

[tool.setuptools.package-data]
"kicraft.eval" = ["rubric.yaml"]
"kicraft.layout_editor" = ["static/*.js"]
"kicraft.parts_library" = ["core_blocks.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E402", "E702", "E741"]

skills:
  customDirectories:
    - ../.agents/skills
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: never
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  fallbackChains:
    openai-codex/*:
      - opencode-go/deepseek-v4.1-flash
    openai-codex/gpt-6-astra:
      - opencode-go/deepseek-v4.1-flash
    openai-codex/gpt-5.6-sol:
      - opencode-go/deepseek-v4.1-flash
    openai-codex/gpt-5.6-luna:
      - opencode-go/deepseek-v4.1-flash
